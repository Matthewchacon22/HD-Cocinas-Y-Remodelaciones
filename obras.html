<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Obras — HD Cocinas Operaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <h1>Obras</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="role-pill" id="role-pill">…</span>
      <button id="logout-btn" class="icon-btn" style="min-height:36px">Salir</button>
    </div>
  </div>

  <div id="list-container">
    <div class="loading-state">Cargando obras…</div>
  </div>
</div>

<button id="new-project-fab" class="fab-new" title="Nueva obra" style="display:none">+</button>

<script type="module">
  import { supabase, requireSession, getCurrentProfile, signOut } from "./supabase.js";
  import { statusLabel } from "./format.js";

  const listEl = document.getElementById("list-container");
  const rolePillEl = document.getElementById("role-pill");
  const fabEl = document.getElementById("new-project-fab");

  document.getElementById("logout-btn").addEventListener("click", signOut);

  async function init() {
    const session = await requireSession();
    if (!session) return;

    const profile = await getCurrentProfile();
    rolePillEl.textContent = { admin: "Administrador", supervisor: "Supervisor", instalador: "Instalador" }[profile.role] || profile.role;

    if (profile.role === "admin" || profile.role === "supervisor") {
      fabEl.style.display = "flex";
      fabEl.style.alignItems = "center";
      fabEl.style.justifyContent = "center";
      fabEl.addEventListener("click", () => window.location.href = "obra-nueva.html");
    }

    await loadProjects();
  }

  async function loadProjects() {
    // RLS ya filtra: instalador solo ve las suyas, admin/supervisor ven todas.
    const { data, error } = await supabase
      .from("projects")
      .select("*")
      .order("created_at", { ascending: false });

    if (error) {
      listEl.innerHTML = `<div class="empty-state">No se pudieron cargar las obras.<br>${error.message}</div>`;
      return;
    }

    if (!data || data.length === 0) {
      listEl.innerHTML = `<div class="empty-state">Todavía no hay obras registradas.</div>`;
      return;
    }

    // Nombres de instalador/supervisor
    const userIds = [...new Set(data.flatMap(p => [p.installer_id, p.supervisor_id]).filter(Boolean))];
    let names = {};
    if (userIds.length) {
      const { data: profiles } = await supabase.from("profiles").select("id, full_name").in("id", userIds);
      names = Object.fromEntries((profiles || []).map(p => [p.id, p.full_name]));
    }

    listEl.innerHTML = data.map(p => `
      <a class="project-card" href="obra.html?id=${p.id}">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="meta">
          ${p.installer_id ? "Instalador: " + escapeHtml(names[p.installer_id] || "—") : "Sin instalador asignado"}
          ${p.client_name ? " · Cliente: " + escapeHtml(p.client_name) : ""}
        </div>
        <div class="progress-track"><div class="progress-fill" style="width:${p.progress_pct || 0}%"></div></div>
        <span class="status-badge status-${p.status}">${statusLabel(p.status)} · ${p.progress_pct || 0}%</span>
      </a>
    `).join("");
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  init();
</script>
</body>
</html>
