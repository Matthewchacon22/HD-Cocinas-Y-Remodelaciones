<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Nueva obra — HD Cocinas Operaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div class="topbar">
    <a class="back" href="obras.html">‹</a>
    <h1>Nueva obra</h1>
    <span></span>
  </div>

  <div class="field"><label>Nombre de la obra</label><input id="f-name" placeholder="Casa Pérez"></div>
  <div class="field"><label>Cliente</label><input id="f-client" placeholder="Nombre del cliente"></div>
  <div class="field"><label>Teléfono</label><input id="f-phone" placeholder="300 000 0000"></div>
  <div class="field"><label>Dirección</label><input id="f-address" placeholder="Dirección de la obra"></div>
  <div class="field"><label>Fecha de inicio</label><input id="f-start" type="date"></div>
  <div class="field"><label>Fecha estimada de entrega</label><input id="f-delivery" type="date"></div>
  <div class="field"><label>Instalador responsable</label><select id="f-installer"><option value="">Sin asignar</option></select></div>
  <div class="field"><label>Supervisor</label><select id="f-supervisor"><option value="">Sin asignar</option></select></div>

  <div style="padding:0 16px">
    <button id="create-btn" class="btn btn-primary">Crear obra</button>
  </div>
  <p id="error-msg" style="color:var(--correccion-ink);padding:0 16px;display:none"></p>
</div>

<script type="module">
  import { supabase, requireSession, getCurrentProfile } from "./supabase.js";

  const installerSel = document.getElementById("f-installer");
  const supervisorSel = document.getElementById("f-supervisor");
  const errEl = document.getElementById("error-msg");
  const btnEl = document.getElementById("create-btn");

  async function init() {
    const session = await requireSession();
    if (!session) return;
    const profile = await getCurrentProfile();
    if (profile.role !== "admin" && profile.role !== "supervisor") {
      document.querySelector(".app-shell").innerHTML =
        '<div class="empty-state">Tu perfil no tiene permiso para crear obras.</div>';
      return;
    }

    // Cargar usuarios por rol para los selects.
    const { data: roles } = await supabase.from("user_roles").select("user_id, role");
    const { data: profiles } = await supabase.from("profiles").select("id, full_name");
    const nameById = Object.fromEntries((profiles || []).map(p => [p.id, p.full_name]));

    (roles || []).filter(r => r.role === "instalador").forEach(r => {
      installerSel.innerHTML += `<option value="${r.user_id}">${nameById[r.user_id] || r.user_id}</option>`;
    });
    (roles || []).filter(r => r.role === "supervisor" || r.role === "admin").forEach(r => {
      supervisorSel.innerHTML += `<option value="${r.user_id}">${nameById[r.user_id] || r.user_id}</option>`;
    });
  }

  async function createProject() {
    const name = document.getElementById("f-name").value.trim();
    if (!name) { showError("El nombre de la obra es obligatorio."); return; }

    btnEl.disabled = true;
    btnEl.textContent = "Creando…";

    const { data, error } = await supabase.rpc("create_project_from_template", {
      p_name: name,
      p_client_name: document.getElementById("f-client").value.trim() || null,
      p_client_phone: document.getElementById("f-phone").value.trim() || null,
      p_address: document.getElementById("f-address").value.trim() || null,
      p_start_date: document.getElementById("f-start").value || null,
      p_estimated_delivery: document.getElementById("f-delivery").value || null,
      p_installer_id: installerSel.value || null,
      p_supervisor_id: supervisorSel.value || null,
    });

    if (error) {
      showError(error.message);
      btnEl.disabled = false;
      btnEl.textContent = "Crear obra";
      return;
    }

    window.location.href = `obra.html?id=${data}`;
  }

  function showError(msg) {
    errEl.textContent = msg;
    errEl.style.display = "block";
  }

  document.getElementById("create-btn").addEventListener("click", createProject);
  init();
</script>
</body>
</html>
